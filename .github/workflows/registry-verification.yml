name: Registry Verification
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Verification run mode
        required: false
        default: success
        type: choice
        options:
          - success
          - fail
          - slow
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Create artifact
        run: echo "registry verification" > artifact.txt
      - name: Optional delay
        if: ${{ inputs.mode == 'slow' }}
        run: sleep 120
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: registry-verification-artifact
          path: artifact.txt
      - name: Optional failure
        if: ${{ inputs.mode == 'fail' }}
        run: exit 1
